<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Arbolito product demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700&display=block" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Arbolito product demo: about 5 minutes, 1920×1080, 30 fps. Deterministic: render(t) draws the frame at t.
// Built from design/demo/shots/ (see SHOTLIST.md). Every scene says whether it is live on Celo mainnet or
// the Mini App's demo mode, so nothing scripted passes for real activity.
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const C = {
  navy: "#0b1220", navy2: "#121a2c", ink: "#f2f3f7", muted: "#8b93a7", grey: "#a3abbf",
  lime: "#c6ef4e", blue: "#4447d8", pink: "#e4288c", line: "#2a3346", amber: "#ffb84d",
};
const F = {
  arch: (w, s) => `${w} ${s}px Archivo`,
  serif: (s, it = false) => `${it ? "italic " : ""}400 ${s}px "Instrument Serif"`,
  mono: (w, s) => `${w} ${s}px "JetBrains Mono"`,
  sans: (w, s) => `${w} ${s}px Manrope`,
};

// ── assets ────────────────────────────────────────────────────────────────
const SRC = {
  hero: "shots/en/1.1.png", story: "shots/en/1.3-e.png", calc: "shots/en/2.2.png", proof: "shots/en/2.3-a.png", live: "shots/en/2.3-b.png",
  mp1: "shots/phone/3.1.jpg", mp2: "shots/phone/3.2-a.jpg", mp3: "shots/phone/3.2-c.jpg",
  quote: "shots/phone/3.5-real-quote.jpg", alts: "shots/phone/3.5-real-alternatives.jpg", approve: "shots/phone/3.6-real-minipay-approve.jpg",
  done: "shots/phone/3.8-real-done.jpg", receipt: "shots/phone/3.9-real-receipt.jpg",
  copChat: "shots/app-es/3.4-c.png", copHome: "shots/app-es/3.3-b.png", copPicker: "shots/app-es/3.3-a.png", copReceipt: "shots/app-es/3.10.png",
  copReal: "shots/proof-en/3.11.png", copRealRoute: "shots/proof-en/3.11-b.png",
  tg: "shots/phone/4.4-b.png",
  auto1: "shots/app-es/5.1.png", auto2: "shots/app-es/5.3.png", auto3: "shots/app-es/5.4-c.png", auto4: "shots/app-es/5.5-sheet2-a.png", auto5: "shots/app-es/5.5.png",
  tag: "shots/proof-en/6.4.png", desk: "shots/proof-en/6.1.png", fills: "shots/proof-en/6.2.png", metrics: "shots/proof-en/6.3.png", buy: "shots/proof-en/6.3-b.png", agent: "shots/proof-en/6.5.png",
};
const IMG = {};
const icon = new Image();
icon.src = "../arbolito-icon-512.png";
const storyVideo = document.createElement("video");
storyVideo.src = "shots/en/1.2.webm"; storyVideo.muted = true; storyVideo.preload = "auto";

// ── helpers ───────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = (p) => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const back = (p) => { p = clamp(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const win = (u, a, d) => clamp((u - a) / d);
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function text(s, x, y, font, color, align = "left", spacing = 0, base = "alphabetic") {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = `${spacing}px`; ctx.fillText(s, x, y); ctx.letterSpacing = "0px";
}
function measure(s, font, spacing = 0) { ctx.font = font; ctx.letterSpacing = `${spacing}px`; const w = ctx.measureText(s).width; ctx.letterSpacing = "0px"; return w; }
const typed = (s, p) => s.slice(0, Math.floor(clamp(p) * s.length));
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
/** Wraps text to a width, returns the lines. */
function wrap(s, font, maxW) {
  const words = s.split(" "); const lines = []; let cur = "";
  for (const w of words) { const nx = cur ? `${cur} ${w}` : w; if (measure(nx, font) > maxW && cur) { lines.push(cur); cur = w; } else cur = nx; }
  if (cur) lines.push(cur); return lines;
}

// The Arbolito tree from the 512 icon geometry, centred at (cx, cy), with per-part progress.
function tree(cx, cy, s, parts) {
  const P = (x, y) => [cx + (x - 256) * s, cy + (y - 256) * s];
  const stem = clamp(parts.stem ?? 1);
  if (stem > 0) { const [x0, y0] = P(234, 255); const [, y1] = P(0, 408); const top = lerp(y1, y0, easeOut(stem)); ctx.fillStyle = C.ink; rrect(x0, top, 44 * s, y1 - top, 22 * s); ctx.fill(); }
  const dot = (k, x, y, r, col) => { const q = back(parts[k] ?? 1); if (q <= 0) return; const [px, py] = P(x, y); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, r * s * q, 0, Math.PI * 2); ctx.fill(); };
  dot("pink", 186, 237, 70, C.pink); dot("lime", 326, 237, 70, C.lime); dot("blue", 256, 147, 77, C.blue);
}

const grain = [0, 1, 2, 3].map((k) => {
  const g = document.createElement("canvas"); g.width = g.height = 256;
  const gx = g.getContext("2d"); const img = gx.createImageData(256, 256); const r = rng(99 + k);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gx.putImageData(img, 0, 0); return g;
});

// Soft background: navy with a slow glow, so the frames float.
function backdrop(t, hue = C.blue) {
  bg(C.navy);
  const g = ctx.createRadialGradient(W * 0.72 + Math.sin(t * 0.13) * 80, H * 0.45, 40, W * 0.72, H * 0.5, 900);
  g.addColorStop(0, hue + "33"); g.addColorStop(1, "#0b122000");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ── frames ────────────────────────────────────────────────────────────────
/** A browser window showing a desktop screenshot (16:10) with a slow Ken Burns move. */
function browser(img, x, y, w, p, kb = {}, url = "arbolito-livid.vercel.app") {
  const bar = 46, ch = w * 0.625, h = ch + bar;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rrect(x, y, w, h, 18); ctx.fillStyle = "#1a2236"; ctx.fill(); ctx.restore();
  ctx.save(); rrect(x, y, w, h, 18); ctx.clip();
  ctx.fillStyle = "#1a2236"; ctx.fillRect(x, y, w, bar);
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 26 + i * 22, y + bar / 2, 6.5, 0, Math.PI * 2); ctx.fill(); });
  rrect(x + w / 2 - 260, y + 10, 520, bar - 20, 13); ctx.fillStyle = "#0e1526"; ctx.fill();
  text(url, x + w / 2, y + bar / 2 + 6, F.mono(500, 15), C.grey, "center");
  drawKB(img, x, y + bar, w, ch, p, kb);
  ctx.restore();
  return h;
}
/** Draws `img` into a box, zooming from z0 to z1 around a focus point (fx, fy in 0..1). */
function drawKB(img, x, y, w, h, p, { z0 = 1, z1 = 1.06, fx = 0.5, fy = 0.4, fy1 } = {}) {
  if (!img) return;
  const e = easeInOut(p);
  const z = lerp(z0, z1, e); const fyy = fy1 === undefined ? fy : lerp(fy, fy1, e);
  const scale = Math.max(w / img.width, h / img.height) * z;
  const sw = w / scale, sh = h / scale;
  const sx = clamp(fx * img.width - sw / 2, 0, img.width - sw), sy = clamp(fyy * img.height - sh / 2, 0, img.height - sh);
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
/** A phone with a screenshot, centred at (cx, cy), screen height sh. `scroll` 0..1 pans tall screens. */
function phone(img, cx, cy, sh, appear = 1, scroll = 0) {
  const a = easeOut(appear); if (a <= 0) return;
  const sw = sh * 0.462, bz = sh * 0.025;
  const x = cx - sw / 2, y = cy - sh / 2 + (1 - a) * 60;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 26;
  rrect(x - bz, y - bz, sw + bz * 2, sh + bz * 2, sh * 0.07); ctx.fillStyle = "#05070c"; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "#2d3549"; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rrect(x, y, sw, sh, sh * 0.058); ctx.clip();
  if (img) {
    const scale = sw / img.width; const ih = img.height * scale;
    const oy = ih > sh ? -(ih - sh) * clamp(scroll) : (sh - ih) / 2;
    if (ih < sh) { ctx.fillStyle = "#0e1526"; ctx.fillRect(x, y, sw, sh); }
    ctx.drawImage(img, x, y + oy, sw, ih);
  }
  ctx.restore(); ctx.restore();
}

// ── captions ──────────────────────────────────────────────────────────────
/** Left-column caption: kicker, serif title, body, and a provenance chip. */
function caption(u, d, { kicker, title, body, chip, x = 96, y = 300, w = 500 }) {
  const fin = win(u, 0.1, 0.6), fout = 1 - win(u, d - 0.45, 0.45);
  ctx.save(); ctx.globalAlpha = Math.min(fin, fout);
  let yy = y;
  if (kicker) { text(typed(kicker, win(u, 0, 0.7)), x, yy, F.mono(600, 18), C.lime, "left", 3); yy += 62; }
  if (title) {
    const lines = wrap(title, F.serif(64), w); const off = (1 - easeOut(win(u, 0.15, 0.7))) * 26;
    lines.forEach((l, i) => text(l, x, yy + off + i * 70, F.serif(64), C.ink)); yy += lines.length * 70 + 18;
  }
  if (body) {
    ctx.globalAlpha = Math.min(win(u, 0.6, 0.7), fout);
    const lines = wrap(body, F.sans(500, 25), w);
    lines.forEach((l, i) => text(l, x, yy + i * 38, F.sans(500, 25), C.grey)); yy += lines.length * 38 + 28;
  }
  if (chip) { ctx.globalAlpha = Math.min(win(u, 0.9, 0.5), fout); provenance(chip, x, yy); }
  ctx.restore();
}
/** "LIVE ON CELO MAINNET" (lime) or "DEMO MODE · SAMPLE ACCOUNT" (amber). */
function provenance(kind, x, y) {
  const live = kind === "live"; const s = live ? "● LIVE ON CELO MAINNET" : "◌ DEMO MODE · SAMPLE ACCOUNT";
  const f = F.mono(700, 16); const tw = measure(s, f, 2);
  rrect(x, y, tw + 28, 38, 19); ctx.fillStyle = live ? "#c6ef4e1f" : "#ffb84d1f"; ctx.fill();
  ctx.strokeStyle = live ? C.lime : C.amber; ctx.lineWidth = 1.5; ctx.stroke();
  text(s, x + 14, y + 25, f, live ? C.lime : C.amber, "left", 2);
}

// ── timeline ──────────────────────────────────────────────────────────────
const ACTS = ["OPEN", "THE PAGE", "THE RATES", "IN MINIPAY", "CHANGE MONEY", "TELEGRAM", "AUTONOMY", "THE PROOF", "TRY IT"];
const desk = (img, kb) => (u, d) => { const p = u / d; browser(IMG[img], 640, 150, 1200, p, kb); };
const phones = (list) => (u, d) => {
  const n = list.length, sh = n === 1 ? 800 : n === 2 ? 760 : 700, gap = n === 1 ? 0 : n === 2 ? 420 : 380;
  const x0 = 1240 - ((n - 1) * gap) / 2;
  list.forEach((k, i) => { const it = typeof k === "string" ? { img: k } : k; phone(IMG[it.img], x0 + i * gap, 540, sh, win(u, 0.25 + i * 0.45, 0.7), it.scroll ? easeInOut(win(u, 1.2, d - 2.2)) : 0); });
};

const SCENES = [
  // OPEN
  { act: 0, d: 9, draw(u, d) {
      bg(C.navy);
      const s = 1.15;
      tree(W / 2, 470, s, { stem: win(u, 0.3, 0.7), pink: win(u, 0.8, 0.5), lime: win(u, 1.05, 0.5), blue: win(u, 1.3, 0.5) });
      ctx.save(); ctx.globalAlpha = win(u, 2.2, 0.8) * (1 - win(u, d - 0.5, 0.5));
      text("In Buenos Aires, an arbolito is the guy on the street", W / 2, 820, F.serif(54), C.ink, "center");
      text("who changes your dollars.", W / 2, 884, F.serif(54, true), C.lime, "center");
      ctx.restore();
    } },
  { act: 0, d: 8, draw(u, d) {
      backdrop(u);
      ctx.save(); ctx.globalAlpha = win(u, 0, 0.6) * (1 - win(u, d - 0.5, 0.5));
      if (icon.complete) ctx.drawImage(icon, W / 2 - 70, 250, 140, 140);
      text("Arbolito", W / 2, 560, F.serif(150), C.ink, "center");
      text("the money changer that lives in your chat.", W / 2, 640, F.serif(48, true), C.grey, "center");
      ctx.globalAlpha *= win(u, 1.2, 0.8);
      text("MINIPAY  ·  TELEGRAM  ·  CELO  ·  PESOS · REAIS · DÓLARES", W / 2, 760, F.mono(600, 20), C.lime, "center", 4);
      ctx.restore();
    } },
  // THE PAGE
  { act: 1, d: 11, draw(u, d) { backdrop(u); desk("hero", { z0: 1.0, z1: 1.08, fx: 0.35, fy: 0.4 })(u, d);
      caption(u, d, { kicker: "01 — THE PAGE", title: "Ask by text or voice.", body: "Arbolito finds the best rate of the moment and hands you a receipt that proves it.", chip: "live" }); } },
  { act: 1, d: 12, video: true, draw(u, d) { backdrop(u, C.pink);
      const bar = 46, w = 1200, x = 640, y = 150, h = w * 0.625 + bar;
      ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30; rrect(x, y, w, h, 18); ctx.fillStyle = "#1a2236"; ctx.fill(); ctx.restore();
      ctx.save(); rrect(x, y, w, h, 18); ctx.clip(); ctx.fillStyle = "#1a2236"; ctx.fillRect(x, y, w, bar);
      ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 26 + i * 22, y + bar / 2, 6.5, 0, Math.PI * 2); ctx.fill(); });
      rrect(x + w / 2 - 260, y + 10, 520, bar - 20, 13); ctx.fillStyle = "#0e1526"; ctx.fill();
      text("arbolito-livid.vercel.app", x + w / 2, y + bar / 2 + 6, F.mono(500, 15), C.grey, "center");
      if (storyVideo.readyState >= 2) ctx.drawImage(storyVideo, x, y + bar, w, h - bar);
      ctx.restore();
      caption(u, d, { kicker: "00 — CALLE FLORIDA", title: "The street corner, rebuilt.", body: "“¿A cuánto está?” “Mil seiscientos.” The page opens on the conversation every Argentine knows.", chip: "live" }); } },
  // THE RATES
  { act: 2, d: 13, draw(u, d) { backdrop(u, C.lime); desk("calc", { z0: 1.0, z1: 1.18, fx: 0.5, fy: 0.55, fy1: 0.62 })(u, d);
      caption(u, d, { kicker: "02 — THE RATES", title: "Every rate, side by side.", body: "US$ 100 to pesos at the official, MEP, blue, CCL and crypto rates, against Arbolito's live price on Celo.", chip: "live" }); } },
  { act: 2, d: 9, draw(u, d) { backdrop(u); desk("proof", { z0: 1.02, z1: 1.1, fx: 0.5, fy: 0.45 })(u, d);
      caption(u, d, { kicker: "03 — THE PROOF", title: "A receipt anyone can check.", body: "Its fingerprint is anchored on Celo. Change one character and it no longer matches.", chip: "live" }); } },
  { act: 2, d: 8, draw(u, d) { backdrop(u); desk("live", { z0: 1.0, z1: 1.07, fx: 0.5, fy: 0.5 })(u, d);
      caption(u, d, { kicker: "04 — LIVE", title: "Live numbers, with their proof.", body: "Wallets, operations, volume and the desk's fills, each linked to the chain.", chip: "live" }); } },
  // IN MINIPAY
  { act: 3, d: 14, draw(u, d) { backdrop(u, C.blue); phones(["mp1", "mp2", "mp3"])(u, d);
      caption(u, d, { kicker: "IN MINIPAY", title: "Opens inside MiniPay.", body: "Opera's stablecoin wallet, used by millions. While Arbolito waits for its Discover listing, it loads from Developer settings.", chip: "live" }); } },
  // CHANGE MONEY (a real conversion, then pesos colombianos)
  { act: 4, d: 13, draw(u, d) { backdrop(u, C.lime); phones(["quote", "alts"])(u, d);

  { act: 4, d: 10, draw(u, d) { backdrop(u); phones(["approve"])(u, d);
      caption(u, d, { kicker: "YOUR WALLET, YOUR SIGNATURE", title: "You confirm in MiniPay.", body: "Arbolito never holds your money. MiniPay asks you to approve, and gas is paid in dollars.", chip: "live" }); } },
  { act: 4, d: 12, draw(u, d) { backdrop(u, C.lime); phones(["done", { img: "receipt", scroll: true }])(u, d);
      caption(u, d, { kicker: "DONE IN SECONDS", title: "“Done. You got R$ 5.45.”", body: "The receipt shows how it compares with Western Union, whose live rate Arbolito reads by paying for a browser over x402.", chip: "live" }); } },
  { act: 4, d: 13, draw(u, d) { backdrop(u, C.amber); phones(["copPicker", "copChat", "copReceipt"])(u, d);
      caption(u, d, { kicker: "PESOS COLOMBIANOS", title: "Now in COP and MXN too.", body: "“Cámbiame 2 dólares a pesos colombianos.” The same flow, in the pesos people in Colombia earn.", chip: "demo" }); } },
  { act: 4, d: 12, draw(u, d) { backdrop(u, C.lime); desk("copReal", { z0: 1.0, z1: 1.1, fx: 0.5, fy: 0.3, fy1: 0.5 })(u, d);
      caption(u, d, { kicker: "ON MAINNET", title: "US$ 1 → COP 3,206.63.", body: "A real wCOP conversion through Textile FX, 1.33% above the interbank rate, anchored and verified.", chip: "live" }); } },
  // TELEGRAM
  { act: 5, d: 13, draw(u, d) { backdrop(u, C.blue);

        ctx.save(); ctx.globalAlpha = win(u, 0.3, 0.6); ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; rrect(x - 14, y - 14, w + 28, h + 28, 22); ctx.fillStyle = "#17212b"; ctx.fill(); ctx.shadowColor = "transparent";
        ctx.save(); rrect(x, y, w, h, 12); ctx.clip(); ctx.drawImage(img, x, y, w, h); ctx.restore(); ctx.restore();

      caption(u, d, { kicker: "TELEGRAM", title: "The same agent, in chat.", body: "“¿Cuánto me dan por 10 dólares en reales?” Text or voice notes, in Spanish, Portuguese or English. It hands off to MiniPay to sign.", chip: "live" }); } },
  // AUTONOMY
  { act: 6, d: 12, draw(u, d) { backdrop(u, C.lime); phones(["auto1", "auto2", "auto3"])(u, d);
      caption(u, d, { kicker: "AUTONOMY", title: "Let it act for you.", body: "Split your pay into pesos, or pay rent every month. You set the limits: here US$ 5 per operation, US$ 20 a day.", chip: "demo" }); } },

      caption(u, d, { kicker: "VERIFY IT YOURSELF", title: "Tagged and anchored.", body: "Every transaction carries Arbolito's attribution tag, celo_e054d92430a5, and every receipt's fingerprint is written to Celo.", chip: "live" }); } },
  { act: 7, d: 12, draw(u, d) { backdrop(u, C.pink); desk("desk", { z0: 1.0, z1: 1.08, fx: 0.5, fy: 0.4 })(u, d);
      caption(u, d, { kicker: "ARBOLITO DESK", title: "A market maker on Textile FX.", body: "It quotes six corridors (wARS, wBRL, wCOP, wMXN, USDC, USA₮) from its own inventory, pricing from many sources with a circuit breaker.", chip: "live" }); } },

  { act: 7, d: 10, draw(u, d) { backdrop(u, C.blue); desk("buy", { z0: 1.0, z1: 1.08, fx: 0.5, fy: 0.4 })(u, d);
      caption(u, d, { kicker: "PAYS ITS OWN WAY", title: "Western Union, read over x402.", body: "Every 6 hours the agent rents a browser through buy and pays from its own wallet, so quotes show what you save.", chip: "live" }); } },
  { act: 7, d: 10, draw(u, d) { backdrop(u); browser(IMG.agent, 640, 150, 1200, u / d, { z0: 1.0, z1: 1.1, fx: 0.4, fy: 0.3 }, "8004scan.io");
      caption(u, d, { kicker: "ONCHAIN IDENTITY", title: "Agent #9976.", body: "Registered under ERC-8004 from the same wallet that pays for buy and signs as the agent.", chip: "live" }); } },
  // TRY IT
  { act: 8, d: 13, draw(u, d) {
      bg(C.navy);
      const s = 0.7; tree(W / 2, 330, s, { stem: win(u, 0.1, 0.5), pink: win(u, 0.4, 0.4), lime: win(u, 0.55, 0.4), blue: win(u, 0.7, 0.4) });
      ctx.save(); ctx.globalAlpha = win(u, 1.0, 0.6);
      text("Arbolito", W / 2, 620, F.serif(130), C.ink, "center");
      text("the money changer that shows its receipts.", W / 2, 690, F.serif(44, true), C.grey, "center");
      ctx.globalAlpha = win(u, 2.0, 0.6);
      text("arbolito-livid.vercel.app/app   ·   t.me/arbolitoo_bot", W / 2, 800, F.mono(600, 26), C.lime, "center", 1);
      ctx.globalAlpha = win(u, 2.8, 0.6);
      text("Built on Celo · Ripio wFIAT · Textile FX · MiniPay · buy · ERC-8004", W / 2, 860, F.mono(500, 19), C.grey, "center", 2);
      ctx.restore();
      const out = win(u, d - 0.8, 0.8); if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${out})`; ctx.fillRect(0, 0, W, H); }
    } },
];
const CUTS = [0]; for (const s of SCENES) CUTS.push(CUTS[CUTS.length - 1] + s.d);
const DUR = CUTS[CUTS.length - 1];
// The story video: its scroll runs from about 6 s to 17 s of the recording.
const STORY_FROM = 6.2, STORY_TO = 17.0;

// ── HUD ───────────────────────────────────────────────────────────────────
function hud(t, act) {
  const col = C.grey;
  text("ARBOLITO — PRODUCT DEMO — 2026", 80, 74, F.mono(500, 18), col, "left", 4);
  text(`${String(act + 1).padStart(2, "0")} — ${ACTS[act]}`, W - 80, 74, F.mono(500, 18), col, "right", 4);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), fr = Math.floor((t % 1) * FPS);
  const tc = `00:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  text(tc, 80, 1012, F.mono(500, 18), col, "left", 3);
  ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(80, 1040); ctx.lineTo(W - 80, 1040); ctx.stroke();
  let last = -1; SCENES.forEach((sc, i) => { if (sc.act !== last) { const x = 80 + (CUTS[i] / DUR) * (W - 160); ctx.beginPath(); ctx.moveTo(x, 1036); ctx.lineTo(x, 1050); ctx.stroke(); last = sc.act; } });
  ctx.globalAlpha = 1;
  const hx = 80 + (t / DUR) * (W - 160); ctx.fillStyle = C.lime; ctx.fillRect(hx - 1.5, 1030, 3, 22);
}

async function render(t) {
  let i = 0; while (i < SCENES.length - 1 && t >= CUTS[i + 1]) i++;
  const sc = SCENES[i]; const u = t - CUTS[i];
  if (sc.video) {
    const vt = lerp(STORY_FROM, STORY_TO, clamp(u / sc.d));
    if (Math.abs(storyVideo.currentTime - vt) > 0.001) { await new Promise((r) => { storyVideo.onseeked = r; storyVideo.currentTime = vt; }); }
  }
  ctx.save(); sc.draw(u, sc.d, t); ctx.restore();
  // a quick dip between scenes
  const dip = Math.max(1 - win(u, 0, 0.25), win(u, sc.d - 0.2, 0.2));
  if (dip > 0 && i > 0) { ctx.fillStyle = `rgba(11,18,32,${dip * 0.85})`; ctx.fillRect(0, 0, W, H); }
  hud(t, sc.act);
  ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = "overlay";
  const g = grain[Math.floor(t * FPS) % 4]; for (let x = 0; x < W; x += 256) for (let y = 0; y < H; y += 256) ctx.drawImage(g, x, y);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

// ── soundtrack (synthesised, original): a calm pad per act, soft pulse, a lift at the end ──
async function soundtrack() {
  const SR = 48000; const ac = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  const master = ac.createGain(); master.gain.value = 0.7;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  master.connect(comp).connect(ac.destination);
  const dl = ac.createDelay(1); dl.delayTime.value = 0.5; const fb = ac.createGain(); fb.gain.value = 0.3; const wet = ac.createGain(); wet.gain.value = 0.22;
  dl.connect(fb).connect(dl); dl.connect(wet).connect(master);
  const noise = ac.createBuffer(1, SR * 2, SR); const nd = noise.getChannelData(0); const nr = rng(5); for (let i = 0; i < nd.length; i++) nd[i] = nr() * 2 - 1;
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59], [45, 52, 57, 64], [41, 48, 57, 60], [43, 50, 55, 62], [40, 47, 55, 59], [45, 52, 57, 60], [41, 48, 53, 60]];
  // act spans
  const spans = []; SCENES.forEach((sc, i) => { const last = spans[spans.length - 1]; if (last && last.act === sc.act) last.e = CUTS[i + 1]; else spans.push({ act: sc.act, s: CUTS[i], e: CUTS[i + 1] }); });
  spans.forEach(({ act, s, e }) => {
    CH[act].forEach((m, k) => {
      for (const det of [-5, 5]) {
        const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz(m); o.detune.value = det;
        const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420 + act * 60; f.Q.value = 0.6;
        const g = ac.createGain(); const a = (0.018 / (k + 1)) * 2;
        g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(a, s + 1.2); g.gain.setValueAtTime(a, e - 1.0); g.gain.linearRampToValueAtTime(0, e + 0.4);
        o.connect(f).connect(g).connect(master); g.connect(dl); o.start(s); o.stop(e + 0.45);
      }
    });
  });
  // soft pulse (sub on the beat, 90 BPM) from the page on
  for (let tt = CUTS[2]; tt < DUR - 13; tt += 60 / 90) {
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(110, tt); o.frequency.exponentialRampToValueAtTime(48, tt + 0.18);
    const g = ac.createGain(); g.gain.setValueAtTime(0.22, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.35);
    o.connect(g).connect(master); o.start(tt); o.stop(tt + 0.4);
  }
  // shaker on the off-beats
  for (let tt = CUTS[2] + 30 / 90; tt < DUR - 13; tt += 60 / 90) {
    const s = ac.createBufferSource(); s.buffer = noise; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8000;
    const g = ac.createGain(); g.gain.setValueAtTime(0.02, tt); g.gain.exponentialRampToValueAtTime(0.0005, tt + 0.06);
    s.connect(f).connect(g).connect(master); s.start(tt, (tt * 0.37) % 1.5, 0.08);
  }
  // a bell on each act change
  const bell = (at, m) => { for (const [mul, a] of [[1, 0.09], [2.01, 0.035], [3.02, 0.018]]) { const o = ac.createOscillator(); o.frequency.value = hz(m) * mul; const g = ac.createGain(); g.gain.setValueAtTime(a, at); g.gain.exponentialRampToValueAtTime(0.0005, at + 1.8); o.connect(g).connect(master); g.connect(dl); o.start(at); o.stop(at + 1.9); } };
  spans.forEach(({ act, s }) => bell(s + 0.05, CH[act][3] + 12));
  // riser into the end card, then a soft impact
  const endAt = CUTS[SCENES.length - 1];
  { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3;
    f.frequency.setValueAtTime(300, endAt - 4); f.frequency.exponentialRampToValueAtTime(6000, endAt);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, endAt - 4); g.gain.exponentialRampToValueAtTime(0.16, endAt - 0.05); g.gain.linearRampToValueAtTime(0, endAt + 0.05);
    s.connect(f).connect(g).connect(master); s.start(endAt - 4); s.stop(endAt + 0.1); }
  bell(endAt + 0.1, 81); bell(endAt + 1.0, 88);
  master.gain.setValueAtTime(0.7, DUR - 3); master.gain.linearRampToValueAtTime(0, DUR);
  return ac.startRendering();
}

// ── encode to MP4 (H.264 High + AAC) in the browser ───────────────────────
async function encode(onProgress) {
  const { Muxer, ArrayBufferTarget } = Mp4Muxer;
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, audio: { codec: "aac", numberOfChannels: 2, sampleRate: 48000 }, fastStart: "in-memory" });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { throw e; } });
  ve.configure({ codec: "avc1.640028", width: W, height: H, bitrate: 10_000_000, framerate: FPS, avc: { format: "avc" } });
  const total = Math.round(DUR * FPS);
  for (let f = 0; f < total; f++) {
    await render(f / FPS);
    const frame = new VideoFrame(cv, { timestamp: Math.round((f * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(frame, { keyFrame: f % (FPS * 2) === 0 }); frame.close();
    while (ve.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (f % 300 === 0) onProgress?.(f / total);
  }
  await ve.flush();
  const buf = await soundtrack();
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => { throw e; } });
  ae.configure({ codec: "mp4a.40.2", sampleRate: 48000, numberOfChannels: 2, bitrate: 160_000 });
  const L = buf.getChannelData(0), R = buf.getChannelData(1); const N = 1024;
  for (let i = 0; i < buf.length; i += N) {
    const n = Math.min(N, buf.length - i); const data = new Float32Array(n * 2); data.set(L.subarray(i, i + n), 0); data.set(R.subarray(i, i + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i * 1e6) / 48000), data });
    ae.encode(ad); ad.close();
  }
  await ae.flush(); muxer.finalize();
  return new Uint8Array(muxer.target.buffer);
}

window.render = render;
window.duration = () => DUR;
window.sceneStarts = () => CUTS.slice(0, -1);
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all(["900 100px Archivo", "400 100px 'Instrument Serif'", "italic 400 100px 'Instrument Serif'", "700 100px 'JetBrains Mono'", "500 100px 'JetBrains Mono'", "500 100px Manrope"].map((f) => document.fonts.load(f)));
  if (!icon.complete) await new Promise((r) => (icon.onload = r));
  const missing = [];
  await Promise.all(Object.entries(SRC).map(async ([k, src]) => {
    try { const im = new Image(); im.src = src; await im.decode(); IMG[k] = await createImageBitmap(im); } catch { missing.push(src); }
  }));
  if (storyVideo.readyState < 2) await new Promise((r) => { storyVideo.onloadeddata = r; storyVideo.onerror = r; });
  if (missing.length) console.log("missing:", missing.join(", "));
  console.log(`duration ${DUR.toFixed(1)} s, ${SCENES.length} scenes`);
  return true;
})();
window.encodeToBase64Chunks = async () => {
  const bytes = await encode((p) => console.log(`frames ${Math.round(p * 100)}%`));
  const chunks = []; const SZ = 3 * 1024 * 1024;
  for (let i = 0; i < bytes.length; i += SZ) { let s = ""; const part = bytes.subarray(i, i + SZ); for (let j = 0; j < part.length; j += 0x8000) s += String.fromCharCode.apply(null, part.subarray(j, j + 0x8000)); chunks.push(btoa(s)); }
  window.__chunks = chunks; return chunks.length;
};
